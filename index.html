<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dagens Ord">
  <meta name="theme-color" content="#EDE8DF">

  <!-- Inline SVG ikon som apple-touch-icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23EDE8DF'/%3E%3Ctext x='90' y='125' font-family='Georgia,serif' font-size='100' font-weight='700' fill='%232D2520' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">

  <title>Dagens Ord</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #EDE8DF;
      --card: #FAF7F2;
      --ink: #2D2520;
      --muted: #C0A890;
      --border: rgba(180,160,130,0.2);
      --dashed: #D5C8B8;
      --def: #6A5A4A;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background: var(--bg);
      font-family: 'EB Garamond', serif;
      min-height: 100dvh;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      width: 100%;
      background: var(--bg);
      padding: 56px 28px 16px;
      max-width: 480px;
      align-self: center;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9A7A5A;
    }

    .header-count {
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      font-style: italic;
      color: var(--muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
      gap: 10px;
    }

    .sort-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: 1px solid rgba(45,37,32,0.16);
      border-radius: 999px;
      background: rgba(45,37,32,0.06);
      color: var(--ink);
      font-family: 'EB Garamond', serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .sort-btn:hover {
      background: rgba(45,37,32,0.12);
      border-color: rgba(45,37,32,0.28);
      transform: translateY(-1px);
    }

    .sort-btn::after {
      content: '▾';
      display: inline-block;
      font-size: 11px;
      line-height: 1;
      color: var(--muted);
    }

    .header-search {
      margin-top: 14px;
    }

    .header-search input {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(45,37,32,0.15);
      border-radius: 14px;
      padding: 12px 16px;
      font-family: 'EB Garamond', serif;
      font-size: 15px;
      color: var(--ink);
      background: var(--card);
      outline: none;
    }

    .header-search input::placeholder {
      color: var(--muted);
      font-style: italic;
    }

    .card.swipe-delete {
      background: #FDECEC;
      border-color: rgba(225, 90, 80, 0.25);
    }

    .card.swipe-restore {
      background: #ECFDF5;
      border-color: rgba(34, 197, 94, 0.25);
    }

    /* ── Card list ── */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      padding: 8px 20px calc(100px + var(--safe-bottom));
    }

    /* ── Card ── */
    .card {
      position: relative;
      background: var(--card);
      border-radius: 18px;
      padding: 22px 24px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s, transform 0.2s ease, opacity 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .card:active { opacity: 0.85; }

    .card-word {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.1;
      padding-right: 32px;
    }

    .card-fav-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--muted);
      transition: color 0.15s, transform 0.15s;
      line-height: 0;
    }

    .card-fav-btn:active { transform: scale(0.82); }
    .card-fav-btn.active svg { fill: #E05A50; stroke: #E05A50; }
    .card-fav-btn.active { color: #E05A50; }

    .fav-filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(45,37,32,0.16);
      border-radius: 50%;
      background: rgba(45,37,32,0.06);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .fav-filter-btn:hover { background: rgba(45,37,32,0.12); }
    .fav-filter-btn.active { color: #E05A50; border-color: rgba(224,90,80,0.35); background: rgba(224,90,80,0.08); }

    .card-meta {
      font-family: 'EB Garamond', serif;
      font-size: 15px;
      color: var(--muted);
      margin-top: 4px;
      font-style: italic;
    }

    .card-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.open .card-expand {
      max-height: 400px;
    }

    .card-def {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--dashed);
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      line-height: 1.75;
      color: var(--def);
    }

    .card-def em {
      font-style: italic;
      color: #9A7A5A;
    }

    .card-quote {
      margin-top: 10px;
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.65;
      color: #A8896A;
    }

    .card-comment {
      margin-top: 10px;
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      line-height: 1.7;
      color: #B0A090;
    }

    .card-edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
      background: none;
      border: 1px solid var(--dashed);
      border-radius: 8px;
      padding: 5px 11px;
      font-family: 'EB Garamond', serif;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .card-edit-btn:hover { border-color: var(--ink); color: var(--ink); }
    .card-edit-btn:active { opacity: 0.7; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .empty-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .empty-sub {
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      font-style: italic;
      line-height: 1.6;
    }

    /* ── FAB ── */
    .add-btn {
      position: fixed;
      bottom: calc(28px + var(--safe-bottom));
      right: 24px;
      width: 58px;
      height: 58px;
      background: var(--ink);
      color: var(--card);
      border: none;
      font-size: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: transform 0.15s;
      z-index: 6;
    }

    .add-btn:active { transform: scale(0.93); }

    /* ── Trash button ── */
    .trash-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(45,37,32,0.16);
      border-radius: 50%;
      background: rgba(45,37,32,0.06);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .trash-btn:hover { background: rgba(45,37,32,0.12); border-color: rgba(45,37,32,0.28); }
    .trash-btn.active { background: rgba(45,37,32,0.18); border-color: rgba(45,37,32,0.4); }

    .deleted-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #E05A50;
      color: #FAF7F2;
      font-size: 10px;
      font-family: 'EB Garamond', serif;
      line-height: 1;
      border-radius: 999px;
      padding: 2px 5px;
      display: none;
      min-width: 16px;
      text-align: center;
    }

    .deleted-badge.visible { display: block; }

    /* ── Papirkurv action buttons ── */
    .btn-restore {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
      background: none;
      border: 1px solid #B8D8B8;
      border-radius: 8px;
      padding: 5px 11px;
      font-family: 'EB Garamond', serif;
      font-size: 14px;
      color: #5A8A5A;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-restore:hover { border-color: #5A8A5A; }
    .btn-restore:active { opacity: 0.7; }

    .btn-perm-delete {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
      margin-left: 8px;
      background: none;
      border: 1px solid rgba(224,90,80,0.3);
      border-radius: 8px;
      padding: 5px 11px;
      font-family: 'EB Garamond', serif;
      font-size: 14px;
      color: #C05050;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-perm-delete:hover { border-color: #C05050; }
    .btn-perm-delete:active { opacity: 0.7; }

    .restore-all-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border: 1px solid #B8D8B8;
      border-radius: 999px;
      background: rgba(34,197,94,0.07);
      color: #5A8A5A;
      font-family: 'EB Garamond', serif;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restore-all-btn:hover { background: rgba(34,197,94,0.14); }

    .empty-trash-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border: 1px solid rgba(224,90,80,0.3);
      border-radius: 999px;
      background: rgba(224,90,80,0.07);
      color: #C05050;
      font-family: 'EB Garamond', serif;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .empty-trash-btn:hover { background: rgba(224,90,80,0.14); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45,37,32,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 32px 20px calc(32px + var(--safe-bottom));
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(80px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-drag-area {
      padding: 8px 0 16px;
      display: flex;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      margin: -8px -20px 0;
      padding-left: 20px;
      padding-right: 20px;
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--dashed);
      border-radius: 2px;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .modal input, .modal textarea {
      width: 100%;
      background: var(--bg);
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'EB Garamond', serif;
      font-size: 18px;
      color: var(--ink);
      outline: none;
      margin-bottom: 10px;
      resize: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .modal input::placeholder, .modal textarea::placeholder {
      color: #C0A890;
      font-style: italic;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-add {
      flex: 1;
      background: var(--ink);
      color: var(--card);
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add:active { opacity: 0.8; }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--dashed);
      border-radius: 14px;
      padding: 16px 20px;
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      color: var(--muted);
      cursor: pointer;
    }

    .btn-lookup {
      width: 100%;
      margin-bottom: 12px;
      padding: 11px;
      background: transparent;
      border: 1px dashed var(--dashed);
      border-radius: 12px;
      font-family: 'EB Garamond', serif;
      font-size: 15px;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-lookup:hover:not(:disabled) { background: rgba(45,37,32,0.05); color: var(--ink); }
    .btn-lookup:disabled { opacity: 0.55; cursor: default; }

    /* ── Section tabs ── */
    .section-tabs {
      display: flex;
      margin-top: 10px;
      background: rgba(45,37,32,0.06);
      border-radius: 999px;
      padding: 3px;
      width: fit-content;
    }

    .section-tab {
      padding: 5px 18px;
      border: none;
      border-radius: 999px;
      background: none;
      font-family: 'EB Garamond', serif;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .section-tab.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* ── Flashcards ── */
    .flash-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 480px;
      padding: 8px 20px calc(24px + var(--safe-bottom));
    }

    .flash-wrap.open { display: flex; }

    .flash-modes {
      display: flex;
      background: rgba(45,37,32,0.06);
      border-radius: 999px;
      padding: 3px;
    }

    .flash-modes .section-tab {
      padding: 6px 13px;
      font-size: 13px;
      white-space: nowrap;
    }

    .flash-card {
      width: 100%;
      height: min(50vh, 400px);
      perspective: 1600px;
      cursor: pointer;
    }

    .flash-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flash-card.flipped .flash-inner { transform: rotateY(180deg); }
    .flash-card.no-anim .flash-inner { transition: none; }

    .flash-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.08);
      padding: 34px 28px 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-y: auto;
    }

    .flash-back { transform: rotateY(180deg); }

    .flash-label {
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9A7A5A;
      margin-bottom: 20px;
    }

    .flash-word {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .flash-def {
      font-family: 'EB Garamond', serif;
      font-size: 19px;
      line-height: 1.7;
      color: var(--def);
    }

    .flash-da {
      margin-top: 14px;
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      font-style: italic;
      color: #B0A090;
    }

    .flash-hint {
      position: absolute;
      bottom: 26px;
      left: 28px;
      right: 28px;
      font-family: 'EB Garamond', serif;
      font-size: 14px;
      font-style: italic;
      color: var(--muted);
    }

    .flash-next {
      width: 100%;
      background: var(--ink);
      color: var(--card);
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .flash-next:active { transform: scale(0.98); opacity: 0.85; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title" id="headerTitle">Dagens Ord</div>
    <div class="section-tabs" id="sectionTabs">
      <button class="section-tab active" data-section="da" onclick="switchSection('da')">Dansk</button>
      <button class="section-tab" data-section="en" onclick="switchSection('en')">Engelsk</button>
    </div>
    <div class="header-count" id="wordCount"></div>
    <div class="header-search" id="headerSearch">
      <input type="search" id="searchInput" placeholder="Søg ord..." oninput="setSearch(this.value)">
    </div>
    <div class="header-actions">
      <button class="sort-btn" id="sortBtn" onclick="toggleSort()">Sorter: Alfabetisk</button>
      <button class="restore-all-btn" id="restoreAllBtn" onclick="restoreAll()">Gendan alle</button>
      <button class="empty-trash-btn" id="emptyTrashBtn" onclick="emptyTrash()">Tøm papirkurv</button>
      <button class="fav-filter-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="Vis kun favoritter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="trash-btn" id="flashBtn" onclick="toggleFlash()" title="Flashcards">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="15" height="13" rx="2"/><path d="M7 4h13a2 2 0 0 1 2 2v11"/></svg>
      </button>
      <button class="trash-btn" id="trashBtn" onclick="toggleView()" title="Papirkurv">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        <span class="deleted-badge" id="deletedBadge"></span>
      </button>
    </div>
  </div>

  <div class="card-list" id="cardList"></div>

  <div class="flash-wrap" id="flashWrap">
    <div class="flash-modes" id="flashModes">
      <button class="section-tab active" data-mode="word" onclick="setFlashMode('word')">Ord → Betydning</button>
      <button class="section-tab" data-mode="def" onclick="setFlashMode('def')">Betydning → Ord</button>
      <button class="section-tab" data-mode="mix" onclick="setFlashMode('mix')">Bland</button>
    </div>
    <div class="flash-card" id="flashCard" onclick="flipFlash()">
      <div class="flash-inner">
        <div class="flash-face flash-front" id="flashFront"></div>
        <div class="flash-face flash-back" id="flashBack"></div>
      </div>
    </div>
    <button class="flash-next" onclick="nextFlash(event)">Næste kort</button>
  </div>

  <button class="add-btn" id="addBtn" onclick="openModal()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-drag-area" id="modalDragArea">
        <div class="modal-handle"></div>
      </div>
      <div class="modal-title" id="modalTitle">Nyt ord</div>
      <input type="text" id="inputWord" placeholder="Ordet..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button type="button" class="btn-lookup" id="lookupBtn" onclick="lookupWord()">Slå op automatisk</button>
      <textarea id="inputDef" rows="2" placeholder="Definition..."></textarea>
      <textarea id="inputComment" rows="2" placeholder="Din egen kommentar... (valgfrit)"></textarea>
      <textarea id="inputQuote" rows="2" placeholder="Citat... (valgfrit)"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuller</button>
        <button class="btn-add" id="modalSubmitBtn" onclick="submitModal()">Tilføj</button>
      </div>
    </div>
  </div>

<script>
  const KEYS = {
    da: { words: 'dagensord-v1',    deleted: 'dagensord-deleted-v1'    },
    en: { words: 'dagensord-en-v1', deleted: 'dagensord-deleted-en-v1' },
  };
  let section = 'da';
  let editingId = null;
  let sortMode = 'alpha';
  let searchTerm = '';
  let viewMode = 'main';
  let showFavoritesOnly = false;
  let flashMode = 'word';
  let flashQueue = [];
  let flashEntry = null;
  let flashTotal = 0;
  let flashShowWord = true;

  function readStorage(key)  { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
  function writeStorage(key, words) { localStorage.setItem(key, JSON.stringify(words)); }
  function loadWords()        { try { return JSON.parse(localStorage.getItem(KEYS[section].words))   || []; } catch { return []; } }
  function saveWords(words)   { localStorage.setItem(KEYS[section].words,   JSON.stringify(words)); }
  function loadDeleted()      { try { return JSON.parse(localStorage.getItem(KEYS[section].deleted)) || []; } catch { return []; } }
  function saveDeleted(words) { localStorage.setItem(KEYS[section].deleted, JSON.stringify(words)); }

  function switchSection(s) {
    section = s;
    searchTerm = '';
    showFavoritesOnly = false;
    document.getElementById('searchInput').value = '';
    document.getElementById('favFilterBtn').classList.remove('active');
    document.querySelectorAll('.section-tab[data-section]').forEach(t => t.classList.toggle('active', t.dataset.section === s));
    if (viewMode === 'flash') {
      flashQueue = [];
      nextFlash();
      return;
    }
    if (viewMode === 'deleted') {
      viewMode = 'main';
      applyViewChrome();
    }
    renderAll();
  }

  function applyViewChrome() {
    const inDeleted = viewMode === 'deleted';
    const inFlash   = viewMode === 'flash';
    document.getElementById('trashBtn').classList.toggle('active', inDeleted);
    document.getElementById('flashBtn').classList.toggle('active', inFlash);
    document.getElementById('sortBtn').style.display        = inDeleted || inFlash ? 'none' : '';
    document.getElementById('headerSearch').style.display   = inDeleted || inFlash ? 'none' : '';
    document.getElementById('favFilterBtn').style.display   = inFlash ? 'none' : '';
    document.getElementById('trashBtn').style.display       = inFlash ? 'none' : '';
    document.getElementById('addBtn').style.display         = inDeleted || inFlash ? 'none' : '';
    document.getElementById('restoreAllBtn').style.display  = inDeleted ? 'inline-flex' : 'none';
    document.getElementById('emptyTrashBtn').style.display  = inDeleted ? 'inline-flex' : 'none';
    document.getElementById('cardList').style.display       = inFlash ? 'none' : '';
    document.getElementById('flashWrap').classList.toggle('open', inFlash);
    document.getElementById('headerTitle').textContent = inDeleted ? 'Papirkurv' : inFlash ? 'Flashcards' : 'Dagens Ord';
  }

  function getVisibleWords() {
    const normalizedSearch = searchTerm.trim().toLowerCase();
    let words = loadWords().filter(entry => {
      if (showFavoritesOnly && !entry.favorite) return false;
      if (!normalizedSearch) return true;
      return entry.word.toLowerCase().includes(normalizedSearch);
    });
    if (sortMode === 'alpha') {
      const locale = section === 'en' ? 'en' : 'da';
      return words.slice().sort((a, b) => a.word.localeCompare(b.word, locale, { sensitivity: 'base' }));
    }
    return words;
  }

  function toggleFavorite(id, e) {
    e.stopPropagation();
    const words = loadWords();
    const idx = words.findIndex(w => w.id === id);
    if (idx === -1) return;
    words[idx].favorite = !words[idx].favorite;
    saveWords(words);
    renderAll();
  }

  function toggleFavFilter() {
    showFavoritesOnly = !showFavoritesOnly;
    document.getElementById('favFilterBtn').classList.toggle('active', showFavoritesOnly);
    renderAll();
  }

  function setSearch(value) {
    searchTerm = value;
    renderAll();
  }

  function toggleSort() {
    sortMode = sortMode === 'alpha' ? 'newest' : 'alpha';
    document.getElementById('sortBtn').textContent = sortMode === 'alpha' ? 'Sorter: Alfabetisk' : 'Sorter: Nyeste først';
    renderAll();
  }

  function deleteWord(id) {
    const words = loadWords();
    const entry = words.find(w => w.id === id);
    if (entry) {
      const deleted = loadDeleted();
      const today = new Date().toLocaleDateString('da-DK', { day: 'numeric', month: 'long' });
      deleted.unshift({ ...entry, deletedAt: today });
      saveDeleted(deleted);
    }
    saveWords(words.filter(w => w.id !== id));
    renderAll();
  }

  function restoreWord(id) {
    const deleted = loadDeleted();
    const entry = deleted.find(w => w.id === id);
    if (entry) {
      const { deletedAt, ...word } = entry;
      const words = loadWords();
      words.unshift(word);
      saveWords(words);
      saveDeleted(deleted.filter(w => w.id !== id));
    }
    renderAll();
  }

  function permanentlyDeleteWord(id) {
    saveDeleted(loadDeleted().filter(w => w.id !== id));
    renderAll();
  }

  function restoreAll() {
    const deleted = loadDeleted();
    if (deleted.length === 0) return;
    const words = loadWords();
    const restored = deleted.map(({ deletedAt, ...w }) => w);
    saveWords([...restored, ...words]);
    saveDeleted([]);
    renderAll();
  }

  function emptyTrash() {
    if (!window.confirm('Slet alle ord i papirkurven permanent?')) return;
    saveDeleted([]);
    renderAll();
  }

  function toggleView() {
    viewMode = viewMode === 'main' ? 'deleted' : 'main';
    applyViewChrome();
    renderAll();
  }

  function toggleFlash() {
    viewMode = viewMode === 'flash' ? 'main' : 'flash';
    applyViewChrome();
    if (viewMode === 'flash') {
      flashQueue = [];
      nextFlash();
    } else {
      renderAll();
    }
  }

  function updateCount(n, mode) {
    const el = document.getElementById('wordCount');
    if (mode === 'deleted') {
      el.textContent = n === 0 ? '' : n === 1 ? '1 slettet ord' : `${n} slettede ord`;
    } else {
      el.textContent = n === 0 ? '' : n === 1 ? '1 ord' : `${n} ord`;
    }
  }

  function updateTrashBadge() {
    const n = loadDeleted().length;
    const badge = document.getElementById('deletedBadge');
    badge.textContent = n;
    badge.classList.toggle('visible', n > 0);
  }

  function makeSwipeCard(card, entry, onSwipeLeft, onSwipeRight) {
    let startX = 0, startY = 0, moved = false, swiping = false, pointerActive = false, ignoreClick = false;
    const threshold = 120;

    function resetSwipe() {
      card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      card.style.transform = '';
      card.style.opacity = '';
      card.classList.remove('swipe-delete', 'swipe-restore');
      moved = false;
      swiping = false;
    }

    card.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('button')) return;
      startX = e.clientX;
      startY = e.clientY;
      pointerActive = true;
      moved = false;
      swiping = false;
      card.setPointerCapture(e.pointerId);
      card.style.transition = 'none';
    });

    card.addEventListener('pointermove', e => {
      if (!pointerActive) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!swiping) {
        if (Math.abs(dx) < 8 || Math.abs(dy) > Math.abs(dx)) return;
        swiping = true;
      }
      moved = true;
      e.preventDefault();
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = `${Math.max(0.35, 1 - Math.abs(dx) / 220)}`;
      card.classList.toggle('swipe-delete', dx < -20);
      card.classList.toggle('swipe-restore', onSwipeRight && dx > 20);
    });

    card.addEventListener('pointerup', e => {
      if (!pointerActive) return;
      pointerActive = false;
      const dx = e.clientX - startX;
      if (moved) {
        ignoreClick = true;
        setTimeout(() => { ignoreClick = false; }, 0);
      }
      card.releasePointerCapture(e.pointerId);
      if (moved && dx < -threshold && onSwipeLeft) {
        card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        card.style.transform = 'translateX(-120%)';
        card.style.opacity = '0';
        setTimeout(() => onSwipeLeft(entry.id), 180);
        return;
      }
      if (moved && dx > threshold && onSwipeRight) {
        card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        card.style.transform = 'translateX(120%)';
        card.style.opacity = '0';
        setTimeout(() => onSwipeRight(entry.id), 180);
        return;
      }
      resetSwipe();
    });

    card.addEventListener('pointercancel', e => {
      if (!pointerActive) return;
      pointerActive = false;
      card.releasePointerCapture(e.pointerId);
      resetSwipe();
    });

    card.addEventListener('click', e => {
      if (ignoreClick) return;
      card.classList.toggle('open');
    });
  }

  function createCard(entry) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = entry.id;

    const hasContent = entry.def || entry.comment || entry.quote;
    card.innerHTML = `
      <div class="card-word">${entry.word}</div>
      <div class="card-meta">${entry.date}</div>
      ${hasContent ? `<div class="card-expand">
        <div class="card-def">
          ${entry.def || ''}
          ${entry.comment ? `<div class="card-comment">${entry.comment}</div>` : ''}
          ${entry.quote ? `<div class="card-quote">"${entry.quote}"</div>` : ''}
        </div>
        <button class="card-edit-btn" onclick="openEditModal(${entry.id}, event)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Rediger
        </button>
      </div>` : `
      <div class="card-expand">
        <button class="card-edit-btn" style="margin-top:16px" onclick="openEditModal(${entry.id}, event)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Rediger
        </button>
      </div>`}
    `;

    makeSwipeCard(card, entry, deleteWord, null);
    return card;
  }

  function createDeletedCard(entry) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = entry.id;

    const hasContent = entry.def || entry.comment || entry.quote;
    card.innerHTML = `
      <div class="card-word">${entry.word}</div>
      <div class="card-meta">${entry.date} · Slettet ${entry.deletedAt}</div>
      <div class="card-expand">
        ${hasContent ? `<div class="card-def">
          ${entry.def || ''}
          ${entry.comment ? `<div class="card-comment">${entry.comment}</div>` : ''}
          ${entry.quote ? `<div class="card-quote">"${entry.quote}"</div>` : ''}
        </div>` : ''}
        <div>
          <button class="btn-restore" onclick="restoreWordBtn(${entry.id}, event)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
            Gendan
          </button>
          <button class="btn-perm-delete" onclick="permDeleteBtn(${entry.id}, event)">
            Slet permanent
          </button>
        </div>
      </div>
    `;

    makeSwipeCard(card, entry, permanentlyDeleteWord, restoreWord);
    return card;
  }

  function restoreWordBtn(id, e) { e.stopPropagation(); restoreWord(id); }
  function permDeleteBtn(id, e)  { e.stopPropagation(); permanentlyDeleteWord(id); }

  function renderAll() {
    if (viewMode === 'deleted') renderDeleted();
    else renderMain();
    updateTrashBadge();
  }

  function renderMain() {
    const list = document.getElementById('cardList');
    const words = getVisibleWords();
    list.innerHTML = '';
    if (words.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-title">${searchTerm ? 'Ingen resultater' : 'Ingen ord endnu'}</div>
          <div class="empty-sub">${searchTerm ? 'Prøv et andet søgeord.' : 'Tryk + for at tilføje<br>dit første ord.'}</div>
        </div>`;
    } else {
      words.forEach(entry => list.appendChild(createCard(entry)));
    }
    updateCount(words.length, 'main');
  }

  function renderDeleted() {
    const list = document.getElementById('cardList');
    const deleted = loadDeleted();
    list.innerHTML = '';
    if (deleted.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-title">Papirkurven er tom</div>
          <div class="empty-sub">Slettede ord vises her.<br>Swipe højre for at gendanne.</div>
        </div>`;
    } else {
      deleted.forEach(entry => list.appendChild(createDeletedCard(entry)));
    }
    updateCount(deleted.length, 'deleted');
  }

  function setFlashMode(mode) {
    flashMode = mode;
    document.querySelectorAll('#flashModes .section-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    flashQueue = [];
    nextFlash();
  }

  function flipFlash() {
    if (flashEntry) document.getElementById('flashCard').classList.toggle('flipped');
  }

  function nextFlash(e) {
    if (e) e.stopPropagation();
    const card = document.getElementById('flashCard');
    card.classList.add('no-anim');
    card.classList.remove('flipped');
    void card.offsetWidth;
    card.classList.remove('no-anim');

    if (flashQueue.length === 0) {
      const pool = loadWords().filter(w => w.def);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      flashQueue = pool;
      flashTotal = pool.length;
    }
    flashEntry = flashQueue.shift() || null;
    flashShowWord = flashMode === 'mix' ? Math.random() < 0.5 : flashMode === 'word';
    renderFlash();
  }

  function renderFlash() {
    const front = document.getElementById('flashFront');
    const back  = document.getElementById('flashBack');
    const count = document.getElementById('wordCount');

    if (!flashEntry) {
      front.innerHTML = `<div class="flash-label">Tomt</div><div class="flash-def">Ingen ord med en definition i denne sektion endnu.</div>`;
      back.innerHTML = '';
      count.textContent = '';
      return;
    }

    const wordFace = `
      <div class="flash-label">Ordet</div>
      <div class="flash-word">${flashEntry.word}</div>`;
    const defFace = `
      <div class="flash-label">Betydning</div>
      <div class="flash-def">${flashEntry.def}</div>`;
    const translation = flashEntry.comment ? `<div class="flash-da">${flashEntry.comment}</div>` : '';

    front.innerHTML = (flashShowWord ? wordFace : defFace) +
      `<div class="flash-hint">Tryk for at vende kortet</div>`;
    back.innerHTML = (flashShowWord ? defFace : wordFace) + translation +
      `<div class="flash-hint">Tryk for at vende tilbage</div>`;

    count.textContent = `${flashTotal - flashQueue.length} af ${flashTotal}`;
  }

  // Swipe-ned-for-at-lukke modal
  (function() {
    const overlay  = document.getElementById('modalOverlay');
    const modal    = overlay.querySelector('.modal');
    const dragArea = document.getElementById('modalDragArea');
    let startY = 0, dy = 0, active = false;

    dragArea.addEventListener('pointerdown', e => {
      startY = e.clientY;
      dy = 0;
      active = true;
      modal.style.transition = 'none';
      dragArea.setPointerCapture(e.pointerId);
    });

    dragArea.addEventListener('pointermove', e => {
      if (!active) return;
      dy = Math.max(0, e.clientY - startY);
      modal.style.transform = `translateY(${dy}px)`;
      overlay.style.background = `rgba(45,37,32,${Math.max(0, 0.45 - dy / 350)})`;
    });

    function finish() {
      if (!active) return;
      active = false;
      if (dy > 90) {
        modal.style.transition = 'transform 0.22s ease';
        modal.style.transform = 'translateY(100%)';
        setTimeout(() => {
          closeModal();
          modal.style.cssText = '';
          overlay.style.background = '';
        }, 220);
      } else {
        modal.style.transition = 'transform 0.25s cubic-bezier(0.32,0.72,0,1)';
        modal.style.transform = '';
        overlay.style.background = '';
        setTimeout(() => { modal.style.transition = ''; }, 250);
      }
    }

    dragArea.addEventListener('pointerup',     finish);
    dragArea.addEventListener('pointercancel', () => {
      if (!active) return;
      active = false;
      modal.style.transition = 'transform 0.25s cubic-bezier(0.32,0.72,0,1)';
      modal.style.transform = '';
      overlay.style.background = '';
      setTimeout(() => { modal.style.transition = ''; }, 250);
    });
  })();

  function openModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Nyt ord';
    document.getElementById('modalSubmitBtn').textContent = 'Tilføj';
    document.getElementById('inputWord').value = '';
    document.getElementById('inputDef').value = '';
    document.getElementById('inputComment').value = '';
    document.getElementById('inputQuote').value = '';
    document.querySelector('#modalOverlay .modal').style.cssText = '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputWord').focus(), 320);
  }

  function openEditModal(id, e) {
    e.stopPropagation();
    const words = loadWords();
    const entry = words.find(w => w.id === id);
    if (!entry) return;

    editingId = id;
    document.getElementById('modalTitle').textContent = 'Rediger ord';
    document.getElementById('modalSubmitBtn').textContent = 'Gem';
    document.getElementById('inputWord').value = entry.word;
    document.getElementById('inputDef').value = entry.def || '';
    document.getElementById('inputComment').value = entry.comment || '';
    document.getElementById('inputQuote').value = entry.quote || '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputWord').focus(), 320);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function submitModal() {
    if (editingId) saveEdit();
    else addWord();
  }

  async function lookupWord() {
    const input = document.getElementById('inputWord');
    const word = input.value.trim();
    if (!word) { input.focus(); return; }
    const btn = document.getElementById('lookupBtn');
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Slår op...';
    try {
      const res = await fetch('/.netlify/functions/lookup', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ word, lang: section }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      if (data.def)     document.getElementById('inputDef').value = data.def;
      if (data.comment) document.getElementById('inputComment').value = data.comment;
      if (data.quote)   document.getElementById('inputQuote').value = data.quote;
      btn.textContent = label;
      btn.disabled = false;
    } catch {
      btn.textContent = 'Kunne ikke slå op - udfyld manuelt';
      setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500);
    }
  }

  function cap(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : str; }

  function addWord() {
    const word    = cap(document.getElementById('inputWord').value.trim());
    const def     = cap(document.getElementById('inputDef').value.trim());
    const comment = cap(document.getElementById('inputComment').value.trim());
    const quote   = cap(document.getElementById('inputQuote').value.trim());
    if (!word) return;

    const today = new Date().toLocaleDateString('da-DK', { day: 'numeric', month: 'long' });
    const entry = { id: Date.now(), word, def, comment, quote, date: today };

    const words = loadWords();
    words.unshift(entry);
    saveWords(words);
    renderAll();
    closeModal();
  }

  function saveEdit() {
    const word    = cap(document.getElementById('inputWord').value.trim());
    const def     = cap(document.getElementById('inputDef').value.trim());
    const comment = cap(document.getElementById('inputComment').value.trim());
    const quote   = cap(document.getElementById('inputQuote').value.trim());
    if (!word) return;

    const words = loadWords();
    const idx = words.findIndex(w => w.id === editingId);
    if (idx === -1) return;

    words[idx] = { ...words[idx], word, def, comment, quote };
    saveWords(words);
    renderAll();
    closeModal();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.key === 'Enter') && (e.metaKey || e.ctrlKey)) submitModal();
    if (viewMode !== 'flash' || document.getElementById('modalOverlay').classList.contains('open')) return;
    if (e.key === ' ')          { e.preventDefault(); flipFlash(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextFlash(); }
  });

  const SEED_DA = [
    { id: 1,  word: "Minutiøs",          date: "9. november 2025",   def: "Grundig og omhyggelig; nøjagtig; detaljeret.",                                                                                    comment: "Særligt præcis og næsten pedantisk nuance, som de andre ord ikke helt dækker.", quote: "" },
    { id: 2,  word: "Pedantisk",          date: "9. november 2025",   def: "Meget, ofte overdrevent nøjeregnende; som går meget op i små og ubetydelige detaljer.",                                          comment: "Formelt for flueknepper. Minutiøs men negativt ladet.",                        quote: "" },

  function parseSeedDate(sectionKey, dateStr) {
    if (sectionKey === 'en') return new Date(dateStr);
    const months = { januar:0, februar:1, marts:2, april:3, maj:4, juni:5, juli:6, august:7, september:8, oktober:9, november:10, december:11 };
    try {
      const [dayPart, rest] = dateStr.split('. ');
      const [mon, yr] = rest.split(' ');
      return new Date(parseInt(yr), months[mon], parseInt(dayPart));
    } catch { return new Date(0); }
  }

  function initializeSection(sectionKey, seed, recovery) {
    const wordsKey = KEYS[sectionKey].words;
    const deletedKey = KEYS[sectionKey].deleted;
    const current = readStorage(wordsKey);

    if (current.length === 0) {
      writeStorage(wordsKey, [...seed].reverse());
      return;
    }

    const seedById = new Map(seed.map(w => [w.id, w]));
    let backfilled = false;
    current.forEach(entry => {
      const seedEntry = seedById.get(entry.id);
      if (!seedEntry) return;
      ['def', 'comment', 'quote'].forEach(field => {
        if (!entry[field] && seedEntry[field]) { entry[field] = seedEntry[field]; backfilled = true; }
      });
    });

    const deletedIds = new Set(readStorage(deletedKey).map(w => w.id));
    const currentIds = new Set(current.map(w => w.id));
    const toAdd = recovery.filter(w => !currentIds.has(w.id) && !deletedIds.has(w.id));
    if (toAdd.length === 0) {
      if (backfilled) writeStorage(wordsKey, current);
      return;
    }

    const userWords = current.filter(w => w.id > 1000);
    const seedWords = [...current.filter(w => w.id <= 1000), ...toAdd]
      .sort((a, b) => parseSeedDate(sectionKey, b.date) - parseSeedDate(sectionKey, a.date));
    writeStorage(wordsKey, [...userWords, ...seedWords]);
  }

  initializeSection('da', SEED_DA, RECOVERY_DA);
  initializeSection('en', SEED_EN, RECOVERY_EN);

  renderAll();
</script>
</body>
</html>
